; PlatformIO Project Configuration File
;
; Firmware THANG NANG gia dinh 2 tang - dung phan cung bo dong ho
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = THANG

[common]
version = '"_THANGNANG_1.0A_"'

[env]
platform = intel_mcs51@2.1.0
board = stc15f2k60s2
upload_speed = 57600
monitor_speed = 38400
extra_scripts = pre:extra_script.py
build_flags =
    -O2
    --opt-code-size
    --stack-auto
    --model-small
    -mz
    -fno-inline
    -fomit-frame-pointer

[env:THANG]
build_flags =
	-DVERSION=${common.version}
