; PlatformIO Project Configuration File
;
; Firmware THANG NANG gia dinh 2 tang - dung phan cung bo dong ho
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = THANG_NO, THANG_NC

[common]
version = '"_THANGMAY_3.0B__"'

[env]
platform = intel_mcs51@2.1.0
board = stc15f2k60s2
upload_speed = 57600
monitor_speed = 38400
extra_scripts = pre:extra_script.py
build_flags =
    -O2
    --opt-code-size
    --stack-auto
    --model-small
    -mz
    -fno-inline
    -fomit-frame-pointer

; Cong tac hanh trinh THUONG MO (NO): cham toi noi -> dong xuong GND
[env:THANG_NO]
build_flags =
	-DVERSION=${common.version}
	-DCT_THUONG_MO=1

; Cong tac hanh trinh THUONG DONG (NC): cham toi noi -> ho ra
[env:THANG_NC]
build_flags =
	-DVERSION=${common.version}
	-DCT_THUONG_MO=0
